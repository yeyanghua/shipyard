# ============================================================
# shipyard worker — k3d dev 单节点部署
# ============================================================
# M8.3 阶段用,k3d 起单节点集群后:
#   k3d image import shipyard-worker:dev -c shipyard   (导入本地镜像)
#   kubectl apply -f k8s/dev/worker-deployment.yaml
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: shipyard
  labels:
    app.kubernetes.io/part-of: shipyard
---
# ============================================================
# ServiceAccount + ClusterRole (最小权限: 只读 cluster/pods/deployments)
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shipyard-worker
  namespace: shipyard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shipyard-worker-readonly
rules:
  # 读所有 namespace (cluster info 列出) — shipyard-worker 需要 ListNamespaces 做 health check
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # 读 pods / deployments (列表页用)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
# ============================================================
# ClusterRole: M9 commit-10 扩写权限 (限定 shipyard-* namespace)
# ============================================================
# V1 简版: 用 Role + RoleBinding (单 namespace 限定) 而不是 ClusterRole.
# 一个 env 一个 Role: shipyard-{env} ns 一一对应, worker 只能动这个 ns.
# M9.5 收 Role 到 1 套 (动态 ns), V2 改 Operator pattern.
#
# 跟 M9 决策对齐:
#   namespace_pattern = "shipyard-{env_name}" (deploy_template 表里配置)
#   4 个 env: dev / test / staging / prod → 4 个 ns
#
# 写权限覆盖:
#   - apps/deployments + statefulsets (主 deploy 对象)
#   - core/services + configmaps + secrets (deploy yaml 多文档常见配套)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shipyard-worker-write
  namespace: shipyard-dev
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shipyard-worker-write
  namespace: shipyard-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shipyard-worker-write
subjects:
  - kind: ServiceAccount
    name: shipyard-worker
    namespace: shipyard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shipyard-worker-write
  namespace: shipyard-test
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shipyard-worker-write
  namespace: shipyard-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shipyard-worker-write
subjects:
  - kind: ServiceAccount
    name: shipyard-worker
    namespace: shipyard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shipyard-worker-write
  namespace: shipyard-staging
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shipyard-worker-write
  namespace: shipyard-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shipyard-worker-write
subjects:
  - kind: ServiceAccount
    name: shipyard-worker
    namespace: shipyard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shipyard-worker-write
  namespace: shipyard-prod
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shipyard-worker-write
  namespace: shipyard-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shipyard-worker-write
subjects:
  - kind: ServiceAccount
    name: shipyard-worker
    namespace: shipyard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shipyard-worker-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shipyard-worker-readonly
subjects:
  - kind: ServiceAccount
    name: shipyard-worker
    namespace: shipyard
---
# ============================================================
# ConfigMap: worker 配置 (env 注入,避免硬编码)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: shipyard-worker-config
  namespace: shipyard
data:
  WORKER_ENV: "dev"
  WORKER_VERSION: "dev"
  # PC 开发机部署 (M8.3c 完整链路):
  #   shipyard 跑 PC 主机 (192.168.10.29:8080), 跨网段到 k8s 集群 (192.168.91.138~140)
  #   worker pod 调 shipyard /api/workers/register 走 host IP, 跨网段 + 防火墙已通
  # 历史: M8.3b 验证时用 host.k3d.internal (k3d 5.x 域名), Mac 主机 shipyard + k3d 同机器
  #       现在换真集群跨网段, 改 192.168.10.29 (PC 主机内网 IP)
  SHIPYARD_URL: "http://192.168.10.29:8080"
  K8S_IN_CLUSTER: "true"
  WORKER_HEARTBEAT_INTERVAL_SEC: "30"
---
# ============================================================
# Secret: worker token (跟 shipyard 共享, HMAC 验签)
# ============================================================
# TODO M8.2: 实际从 shipyard 拿 / 生成,这里先用空 secret 占位
apiVersion: v1
kind: Secret
metadata:
  name: shipyard-worker-token
  namespace: shipyard
type: Opaque
stringData:
  SHIPYARD_WORKER_TOKEN: "dev-worker-token-please-rotate"
---
# ============================================================
# Deployment: worker (replicas=2 高可用, spec §5.1 要求)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipyard-worker
  namespace: shipyard
  labels:
    app: shipyard-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipyard-worker
  template:
    metadata:
      labels:
        app: shipyard-worker
    spec:
      serviceAccountName: shipyard-worker
      containers:
        - name: worker
          image: shipyard-worker:dev       # k3d image import 注入
          imagePullPolicy: Never           # 本地镜像,不拉远程
          ports:
            - containerPort: 8888
              name: http
          envFrom:
            - configMapRef:
                name: shipyard-worker-config
            - secretRef:
                name: shipyard-worker-token
          env:
            # pod 所在节点名 (心跳上报用)
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # shipyard 调 worker 用的 URL — PC 主机走 NodePort 30080
            # 选 worker node 1 (192.168.91.139) 而非 master (192.168.91.138):
            #   - 语义对齐: 跟实际跑 pod 的 node 通信
            #   - 流量不走 control plane 带宽
            #   - 跟 KUBECONFIG 默认 IP 解耦 (KUBECONFIG 仍指 master 是为 kubectl 操作)
            # ⚠️ NodePort 30080 在所有 node 上都暴露, 任一 node IP 都能调 (kube-proxy 转发),
            #   选 139 / 140 / 138 都行, 选 139 是"跟实际跑 pod 的 node 通信" 的最直接体现.
            # 想知道 pod 实际跑哪个 node: kubectl get pods -n shipyard -o wide (看 NODE 列)
            - name: WORKER_PUBLIC_URL
              value: "http://192.168.91.139:30080"
            # V1 demo 默认 token, V1.5 接真鉴权时改必填
            - name: WORKER_TOKEN
              value: "test-token"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# ============================================================
# Service: ClusterIP (集群内访问 — 留给 V1.5 跟 shipyard 一起部署在 k8s 时用)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: shipyard-worker
  namespace: shipyard
  labels:
    app: shipyard-worker
spec:
  type: ClusterIP
  selector:
    app: shipyard-worker
  ports:
    - port: 8888
      targetPort: http
      name: http
---
# ============================================================
# Service: NodePort (PC 主机跨网段访问 worker 用)
# ============================================================
# M8.3c PC 端部署: shipyard 在 192.168.10.29 (PC 主机), worker pod 在 192.168.91.138~140 (家里集群).
# 跨网段调 worker 走 NodePort 30080, shipyard env.workerUrl = http://192.168.91.138:30080.
#
# NodePort 范围 30000-32767, 选 30080 (避开常见 3000x 服务, 跟 8888 容器端口区分)
# 所有 k8s node 节点都开 30080, shipyard 调任一节点 IP 都能路由到 pod.
apiVersion: v1
kind: Service
metadata:
  name: shipyard-worker-nodeport
  namespace: shipyard
  labels:
    app: shipyard-worker
spec:
  type: NodePort
  selector:
    app: shipyard-worker
  ports:
    - port: 8888
      targetPort: http
      nodePort: 30080
      name: http
