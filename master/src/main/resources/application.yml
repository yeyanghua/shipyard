# ============================================================
# shipyard backend - application.yml
# ============================================================
# 这文件是 shipyard 平台后端的核心配置,所有可调参数集中这里。
# 关键设计:
# - 用 ${VAR:default} 语法让所有配置都有默认值,V1 不需要任何 .env 就能起
# - 加密 key 用 shipyard.key 启动时读(见 Encrypter)
# - 虚拟线程一行启用 (Java 21 LTS)
# - 12-factor 风格,生产环境用环境变量覆盖
# ============================================================

spring:
  application:
    name: shipyard-backend

  # ============================================================
  # 虚拟线程 (Java 21 LTS, Spring Boot 3.2+)
  # 一行启用,所有阻塞 I/O 自动跑在虚拟线程上
  # 详细: docs/superpowers/specs/2026-08-08-platform-design.md §3.2.1
  # ============================================================
  threads:
    virtual:
      enabled: true

  # ============================================================
  # 数据源: MySQL 8
  # 默认连 docker-compose 起的基础设施 (make infra)
  # 生产环境用环境变量覆盖:
  #   SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD
  # ============================================================
  datasource:
    url: jdbc:mysql://localhost:3306/shipyard?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&useUnicode=true
    username: shipyard
    password: ${MYSQL_PASSWORD:shipyard}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池 - shipyard 是 I/O bound,虚拟线程下不需要大连接池
      # 10-20 个连接足够 100 并发构建(虚拟线程共享少量连接)
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ShipyardHikariCP

  # ============================================================
  # Flyway: 数据库迁移
  # V1__init.sql 等文件在 src/main/resources/db/migration
  # 启动时自动跑未应用的迁移
  # ============================================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # V1 只允许 master 账号跑迁移, V1.5 加 shipyard_migrate 专用账号
    schemas: shipyard
    default-schema: shipyard

  # ============================================================
  # Redis 7
  # 构建状态缓存、deploy_record 分布式锁
  # ============================================================
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:shipyard}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 1000ms

  # ============================================================
  # MyBatis-Plus
  # ============================================================
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    global-config:
      db-config:
        id-type: auto
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0
    mapper-locations: classpath*:/mapper/**/*.xml

  # ============================================================
  # Jackson JSON
  # ============================================================
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ============================================================
# shipyard 自定义配置
# ============================================================
shipyard:
  # AES-256 加密 master key - V1 从配置文件读
  # V1.5 改成从 KMS/HashiCorp Vault 读 (envelope encryption)
  # 长度必须 32 字节 (256 bit),V1 demo 用固定值方便起服务
  # 生产环境必须改!
  crypto:
    master-key: ${SHIPYARD_MASTER_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    algorithm: AES/GCM/NoPadding
    iv-length: 12    # GCM 推荐 12 字节 (96 bit)
    tag-length: 128  # GCM 认证标签 128 bit
    aad: shipyard-platform  # Additional Authenticated Data

  # JWT 配置
  jwt:
    # HS256 secret - V1 demo 用固定值,生产环境必须改!
    secret: ${SHIPYARD_JWT_SECRET:change-me-in-production-please-this-is-not-secure-256bit}
    expiration-seconds: 86400  # 24h
    issuer: shipyard
    whitelist:
      # V1 白名单 - 这些 path 不需要 JWT
      - /api/auth/login
      - /api/auth/register
      - /actuator/**
      - /webhook/drone
      - /api/health

  # drone CI 集成
  drone:
    # drone server URL - V1 demo 用 docker-compose 起的
    url: ${DRONE_SERVER_URL:http://localhost:8081}
    # drone admin token (加密存, 这里 V1 用配置简化)
    admin-token: ${DRONE_ADMIN_TOKEN:}
    # webhook secret (用于 HMAC 验签)
    webhook-secret: ${DRONE_WEBHOOK_SECRET:change-me-drone-webhook-secret}

  # worker 通信
  worker:
    # 默认 worker token (加密存,这里简化为配置)
    default-token: ${WORKER_DEFAULT_TOKEN:change-me-worker-default-token}

  # 监控
  monitor:
    alert-log:
      # P0 告警要不要发飞书/钉钉(V1 不发,只记 log)
      webhook-enabled: false

# ============================================================
# Actuator 端点
# /actuator/health - 健康检查
# /actuator/prometheus - Prometheus 指标
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  prometheus:
    metrics:
      export:
        enabled: true

# ============================================================
# 日志
# ============================================================
logging:
  level:
    root: INFO
    com.shipyard: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    com.baomidou.mybatisplus: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/shipyard-backend.log
    max-size: 50MB
    max-history: 30

# ============================================================
# Springdoc OpenAPI 3 (API 文档自动生成)
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

# ============================================================
# Spring Boot Application info
# ============================================================
info:
  app:
    name: ${spring.application.name}
    version: 0.1.0-SNAPSHOT
    description: shipyard platform master backend
    java:
      version: ${java.version}
    encoding: ${project.build.sourceEncoding}
