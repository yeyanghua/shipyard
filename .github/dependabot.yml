# ============================================================
# Dependabot configuration
# ============================================================
# Auto-keep dependencies up to date
# Grouped updates to reduce PR noise
# ============================================================

version: 2

# ============================================================
# Disable Dependabot for the root README/CHANGELOG
# (these are auto-managed by release-please)
# ============================================================

# ============================================================
# Java / Maven (shipyard backend)
# ============================================================
updates:
  - package-ecosystem: "maven"
    directory: "/shipyard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      # Group patch + minor updates to reduce PR noise
      maven-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Group Spring Boot ecosystem updates
      spring-boot:
        applies-to: version-updates
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
      # Group testing libraries
      testing:
        applies-to: version-updates
        patterns:
          - "org.junit*:*"
          - "org.mockito:*"
          - "org.testcontainers:*"
          - "net.jqwik:*"
    # Allow auto-merge for minor/patch only
    # (manual review for major versions)
    # Note: auto-merge is controlled by GitHub Actions workflow, not here
    ignore:
      # Spring Boot 3.x → 4.x is a major upgrade, skip for now
      - dependency-name: "org.springframework.boot:spring-boot-dependencies"
        update-types: ["version-update:semver-major"]

# ============================================================
# Node.js / pnpm (shipyard Web)
# ============================================================
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "web"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      vue-ecosystem:
        applies-to: version-updates
        patterns:
          - "vue*"
          - "@vue/*"
          - "element-plus"
          - "pinia"
          - "vue-router"
      build-tools:
        applies-to: version-updates
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "typescript"
          - "eslint*"

# ============================================================
# Go modules (worker)
# ============================================================
  - package-ecosystem: "gomod"
    directory: "/worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      k8s-ecosystem:
        applies-to: version-updates
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"

# ============================================================
# Docker base images
# ============================================================
  - package-ecosystem: "docker"
    directory: "/shipyard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"

# ============================================================
# GitHub Actions
# ============================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      prefix-development: "ci"
      include: "scope"
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
          - "github/*"
